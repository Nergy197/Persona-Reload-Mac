<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Persona Reload • Mac Desktop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="desktop" aria-label="Menu ứng dụng phong cách Persona 3 Reload">
    <div class="background" aria-hidden="true"><div class="character"></div></div>
    <div class="rays" aria-hidden="true"></div>
    <div class="bubbles" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <header class="date-panel"><span class="date" id="date">10 / 02</span><span class="weekday" id="weekday">FRIDAY</span></header>
    <div class="time-panel"><span>YOUR TIME / YOUR WORLD</span><strong id="time">08:25</strong></div>
    <nav class="menu" aria-label="Ứng dụng Mac"><div class="eyebrow">PERSONAL / DESKTOP</div><div id="app-list" class="app-list"></div></nav>
    <div class="description" aria-live="polite"><span class="description-index" id="index">01 / 08</span><h1 id="description">Browse your files</h1><p id="description-vi">Mở tệp và thư mục</p></div>
    <footer><span class="mode" id="mode">PREVIEW</span><span class="hint"><kbd>↑ ↓</kbd> Select <i></i><kbd>↵</kbd> Open <i></i><span>Hover & click</span></span></footer>
    <div class="toast" role="status" id="toast"></div>
    <div class="confirm-flash" aria-hidden="true"></div>
  </main>
  <script src="config.js"></script>
  <script src="menu.js"></script>
  <script src="ripple.js"></script>
</body>
</html>
